<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Digit - Sandbox</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

  <div id="mobileApp" class="mobile-app">
    
<div id="startScreen" class="screen active">
      <canvas id="startBgCanvas" class="bg-canvas"></canvas>


      <div id="home" class="tab-content active">
        
        <div class="header header--tournament">
          <h1>DIGIT</h1>
          <div class="subtitle subtitle--tournament">MATH</div>
        </div>

<section class="home-hero">
          
          <div class="home-hero__rewards" aria-label="Rewards hint">
            <div class="rh-item">
              <span class="rh-ico" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none">
                  <path d="M20 12v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                  <path d="M4 12h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                  <path d="M12 22V12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                  <path d="M4 7h16v5H4V7Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
                  <path d="M12 7c-1.8 0-3-1.1-3-2.4C9 3.6 9.8 3 10.7 3c1.1 0 1.9.8 2.3 2 .4-1.2 1.2-2 2.3-2 .9 0 1.7.6 1.7 1.6C17 5.9 15.8 7 14 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </span>
              <span class="rh-txt">Telegram Gifts</span>
            </div>
          </div>

          <div class="hero-timer hero-timer--lux">
            <p class="hero-timer__label">Season ends in</p>

            <span id="heroTimer" class="hero-timer__clock hero-timer__clock--source">90:12:45</span>

            <div class="lux-timer" aria-label="Tournament countdown">
              
              <div class="lux-unit" aria-label="Days">
                <span class="lux-digit lux-digit--slot" id="heroTimerD1">9</span>
                <span class="lux-digit lux-digit--slot" id="heroTimerD2">0</span>
              </div>

              <div class="lux-sep">:</div>

              <div class="lux-unit" aria-label="Hours">
                <span class="lux-digit lux-digit--slot" id="heroTimerH1">1</span>
                <span class="lux-digit lux-digit--slot" id="heroTimerH2">2</span>
              </div>

              <div class="lux-sep">:</div>

              <div class="lux-unit" aria-label="Mins">
                <span class="lux-digit lux-digit--slot" id="heroTimerM1">4</span>
                <span class="lux-digit lux-digit--slot" id="heroTimerM2">5</span>
              </div>

            </div>
          </div>
        </section>
<div class="play-cta play-cta--premium">
          <button id="startGameBtn" class="btn play-cta__btn play-cta__btn--premium">
            PLAY
            <span class="cta-arrow" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none">
                <path d="M9 5l7 7-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </span>
          </button>
          
          <div class="play-cta__hint" style="display: flex; gap: 10px; align-items: center; margin-top: 15px;">
            <span style="color: #fff; font-weight: 700;">⚡ 3/3 FREE</span>
            <span style="color: rgba(255,255,255,0.3);">|</span>
            <span style="color: var(--cosmic-accent); font-weight: 600;">🎯 5,000 PTS = 1 🎟️</span>
          </div>
        </div>

        <div class="league-preview" aria-label="Level system">
          <div class="league-preview__head">
            <span class="lp-ico" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
              </svg>
            </span>
            <span class="league-preview__title">ENERGY RECHARGE</span>
          </div>

          <div style="display: flex; justify-content: space-between; align-items: center; padding: 10px 5px; border-bottom: 1px solid rgba(255,255,255,0.1);">
            <div style="display: flex; flex-direction: column;">
              <span style="font-family: 'Orbitron', monospace; font-size: 1.2rem; color: #fff; font-weight: 900;">LEVEL 1</span>
              <span style="font-size: 0.7rem; color: rgba(255,255,255,0.5);">Max 1 purchase / day</span>
            </div>
            
            <button style="background: rgba(10,10,26,0.8); border: 1px solid var(--cosmic-primary); border-radius: 12px; padding: 8px 15px; color: #fff; font-weight: 700; font-family: 'Orbitron', monospace; cursor: pointer; display: flex; align-items: center; gap: 6px; box-shadow: 0 0 10px rgba(255, 107, 53, 0.2); transition: transform 0.1s;">
              +3 ⚡ FOR 1 ⭐
            </button>
          </div>
          
          <div style="text-align: center; margin-top: 12px; font-size: 0.7rem; color: rgba(255,204,0,0.8);">
            Purchases available today: 1 / 1
          </div>
        </div>

        <div class="footer-links">
            <a href="https://t.me/digit_community" target="_blank" class="footer-btn">Community</a>
            <a href="https://telegra.ph/DIGIT-Math-Game--Rules--Terms-01-11" target="_blank" class="footer-btn">Rules & Terms</a>
        </div>
        
      </div>

      <div class="bottom-nav">
        <button class="nav-btn active" data-tab="home"><span class="nav-icon">🏠</span><span class="nav-text">Play</span></button>
        <button class="nav-btn" data-tab="earn"><span class="nav-icon">💰</span><span class="nav-text">Earn</span></button>
        <button class="nav-btn" data-tab="friends"><span class="nav-icon">🤝</span><span class="nav-text">Friends</span></button>
        <button class="nav-btn" data-tab="wallet"><span class="nav-icon">💳</span><span class="nav-text">Wallet</span></button>
      </div>

    </div>

    <div id="gameScreen" class="screen fullscreen-game">
      <div id="fullscreenGameArea" class="game-area fullscreen-area">
        <canvas id="playBgCanvas" class="bg-canvas"></canvas>
        <canvas id="playCanvas"></canvas>
      </div>
      <div id="warmupOverlay" class="warmup-overlay hidden" aria-hidden="true">
        <div class="warmup-countdown" id="warmupCountdown">3</div>
      </div>
      
      <div class="minimal-stats-vertical">
        <div class="minimal-stat-vertical"><div class="minimal-icon">⏱️</div><div class="minimal-value" id="timer">30</div></div>
        <div class="minimal-stat-vertical"><div class="minimal-icon">⭐</div><div class="minimal-value" id="score">0</div></div>
        <div class="minimal-stat-vertical"><div class="minimal-icon">⚡</div><div class="minimal-value" id="multiplier">1</div></div>
      </div>
    </div>

    <div id="resultModal" class="modal">
      <div class="modal-content">
        <h2>TIME'S UP!</h2>
        <div class="result-stats">
          <div class="result-stat"><span class="stat-label">Score:</span><span class="stat-value" id="finalScore">0</span></div>
        </div>
        <button id="playAgainBtn" class="btn btn-primary">Play Again</button>
      </div>
    </div>

  </div>

  <script src="game.js"></script>
</body>

</html>
