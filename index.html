<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Digit - Sandbox</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

  <div id="mobileApp" class="mobile-app">
    
<div id="startScreen" class="screen active">
      <canvas id="startBgCanvas" class="bg-canvas"></canvas>
      
      <div class="top-header">
        <div class="user-mini-profile">
          <div class="avatar-placeholder">👨‍🚀</div>
          <div class="user-info">
            <span class="user-name" id="profileName">Astronaut</span>
            <span class="user-rank">Rank: Rookie</span>
          </div>
        </div>
        <div class="balances">
          <div class="balance-item">🎫 <span id="ticketBalance">150</span></div>
          <div class="balance-item">⭐ <span id="starBalance">0</span></div>
        </div>
      </div>

      <div class="center-content">
        <div class="season-badge">SEASON 1: 7 WEEKS LEFT</div>
        <h1 class="title">DIGIT</h1>
        
        <button id="startGameBtn" class="btn-play-huge">PLAY</button>
      </div>

      <div class="bottom-dock">
        <button class="dock-btn active"><span class="dock-icon">🏠</span>Home</button>
        <button class="dock-btn"><span class="dock-icon">🎯</span>Tasks</button>
        <button class="dock-btn"><span class="dock-icon">🎁</span>Shop</button>
        <button class="dock-btn"><span class="dock-icon">👤</span>Profile</button>
      </div>
    </div>

    <div id="gameScreen" class="screen fullscreen-game">
      <div id="fullscreenGameArea" class="game-area fullscreen-area">
        <canvas id="playBgCanvas" class="bg-canvas"></canvas>
        <canvas id="playCanvas"></canvas>
      </div>
      <div id="warmupOverlay" class="warmup-overlay hidden" aria-hidden="true">
        <div class="warmup-countdown" id="warmupCountdown">3</div>
      </div>
      
      <div class="minimal-stats-vertical">
        <div class="minimal-stat-vertical"><div class="minimal-icon">⏱️</div><div class="minimal-value" id="timer">30</div></div>
        <div class="minimal-stat-vertical"><div class="minimal-icon">⭐</div><div class="minimal-value" id="score">0</div></div>
        <div class="minimal-stat-vertical"><div class="minimal-icon">⚡</div><div class="minimal-value" id="multiplier">1</div></div>
      </div>
    </div>

    <div id="resultModal" class="modal">
      <div class="modal-content">
        <h2>TIME'S UP!</h2>
        <div class="result-stats">
          <div class="result-stat"><span class="stat-label">Score:</span><span class="stat-value" id="finalScore">0</span></div>
        </div>
        <button id="playAgainBtn" class="btn btn-primary">Play Again</button>
      </div>
    </div>

  </div>

  <script src="game.js"></script>
</body>

</html>
